[build-system]
requires = [
    "hatchling"
]

build-backend = "hatchling.build"



[project]
name = "cb_bsdl_parser"

description = "Chriesibaum's BSDL file parser"

readme = "README.md"

authors = [{ name="Thomas", email="Thomas@chriesibaum.dev" }]

requires-python = ">=3.12"

license = { file="LICENSE" }

classifiers = [
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]

dynamic = [
    "version"
]

dependencies = [
        "antlr4-python3-runtime>=4.13,<4.14",
        "cb_pyutils",
]

[project.optional-dependencies]
dev = [
        "pytest",
        "pytest-cov",
        "pyyaml",
        "pycodestyle",
        "autopep8",
        "bandit",
        "hatch",
        "twine",
        "flake8",
        "genbadge[all]",
]


[project.urls]
Homepage = "https://github.com/chriesibaum/cb_bsdl_parser"
Documentation = "https://chriesibaum.github.io/cb_bsdl_parser/"
Repository = "https://github.com/chriesibaum/cb_bsdl_parser"


[tool.hatch.version]
path = "./cb_bsdl_parser/__init__.py"


[tool.hatch.build.targets.wheel]
packages = ["cb_bsdl_parser/",
            "cb_bsdl_tools/",
            "cb_bsdl_db_tools/"]


[project.scripts]
cb_bsdl_info = "cb_bsdl_tools.cb_bsdl_info:main"
cb_bsdl_check = "cb_bsdl_tools.cb_bsdl_check:main"
cb_bsdl_id_code_db = "cb_bsdl_db_tools.id_code_db:main"


[tool.coverage.report]
omit = [
    # omit this files
    "./cb_bsdl_parser/CBBsdlLexer.py",
    "./cb_bsdl_parser/CBBsdlParser.py"
    ]

[tool.bandit.assert_used]
skips = ['*_test.py', '*/test_*.py', '**/test_*.py']
